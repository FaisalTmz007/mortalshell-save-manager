[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mortalshell-save-manager"
dynamic = ["version"]
description = "Create, load and delete snapshots of Mortal Shell save games."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NinjaTea" }]
keywords = ["mortal-shell", "save-manager", "save-backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.gui-scripts]
mortalshell-save-manager = "mortalshell_save_manager.gui:main"

[project.urls]
Homepage = "https://github.com/FaisalTmz007/mortalshell-save-manager"
Issues = "https://github.com/FaisalTmz007/mortalshell-save-manager/issues"

[tool.setuptools.dynamic]
version = { attr = "mortalshell_save_manager.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
