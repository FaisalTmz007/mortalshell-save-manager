name: Release

# Pushing a tag such as v1.2.0 builds the .exe and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name MortalShellSaveManager
          --paths src src/mortalshell_save_manager/__main__.py
      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MortalShellSaveManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MortalShellSaveManager.exe" | Out-File -Encoding ascii dist\MortalShellSaveManager.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MortalShellSaveManager.exe
            dist/MortalShellSaveManager.exe.sha256
          body_path: docs/RELEASE_NOTES.md
